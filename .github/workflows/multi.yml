name: Build all Ray Client versions

# Builds the client once per Minecraft version listed in the matrix (1.20 to 1.21.11) and uploads every jar as its own
# artifact (Actions -> the run -> Artifacts). build.gradle picks the right per-version compatibility code (src/compat)
# and Java version from the Minecraft version, so nothing else is passed in here. A version that does not compile yet fails alone and
# the others still build; open that job's log to see the compiler errors.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        mc:
          - "1.21.11"
          - "1.21.10"
          - "1.21.9"
          - "1.21.8"
          - "1.21.7"
          - "1.21.6"
          - "1.21.5"
          - "1.21.4"
          - "1.21.3"
          - "1.21.2"
          - "1.21.1"
          - "1.21"
          - "1.20.6"
          - "1.20.5"
          - "1.20.4"
          - "1.20.3"
          - "1.20.2"
          - "1.20.1"
          - "1.20"

    name: Minecraft ${{ matrix.mc }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Look up mappings and Fabric API for this version
        id: deps
        run: |
          yarn=$(curl -fsS "https://meta.fabricmc.net/v2/versions/yarn/${{ matrix.mc }}" | jq -r '.[0].version')
          api=$(curl -fsS -G "https://api.modrinth.com/v2/project/fabric-api/version" \
            --data-urlencode 'loaders=["fabric"]' \
            --data-urlencode 'game_versions=["${{ matrix.mc }}"]' | jq -r '.[0].version_number')
          echo "yarn=$yarn" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "yarn $yarn, fabric api $api"
          test "$yarn" != "null" && test "$api" != "null"

      - name: Build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: >
          gradle build --no-daemon
          -Pminecraft_version=${{ matrix.mc }}
          -Pyarn_mappings=${{ steps.deps.outputs.yarn }}
          -Pfabric_version=${{ steps.deps.outputs.api }}
          -Parchives_base_name=ray-client-mc${{ matrix.mc }}

      - uses: actions/upload-artifact@v4
        with:
          name: ray-client-${{ matrix.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
