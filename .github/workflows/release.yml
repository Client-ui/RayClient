name: Release Ray Client

# Publishes a GitHub Release with the mod jar (this is what the in-game updater downloads).
# To release: set mod_version in gradle.properties (e.g. 1.11.0), commit, then push a tag that matches it:
#   git tag v1.11.0
#   git push origin v1.11.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Read version and check the tag
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "VER=$VER" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VER" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version $VER in gradle.properties"
            exit 1
          fi

      - name: Build Ray Client
        run: gradle build --no-daemon

      - name: Prepare release files
        run: |
          mkdir -p out
          cp "build/libs/ray-client-${VER}.jar" out/
          HASH=$(sha256sum "out/ray-client-${VER}.jar" | cut -d' ' -f1)
          printf 'Ray Client %s for Minecraft 1.21.11 (Fabric).\n\nsha256: %s\n\n' "$VER" "$HASH" > notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Ray Client ${{ env.VER }}
          body_path: notes.md
          generate_release_notes: true
          files: out/*.jar 
          
