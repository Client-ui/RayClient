name: Release Ray Client

# Publishes a GitHub Release with the mod jar (this is what the in-game updater downloads).
# Easiest way to release: Actions -> Release Ray Client -> Run workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Read version and check the tag
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "VER=$VER" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VER" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version $VER in gradle.properties"
            exit 1
          fi

      - name: Build Ray Client
        run: gradle build --no-daemon

      - name: Prepare release files
        run: |
          mkdir -p out
          cp "build/libs/ray-client-${VER}.jar" out/
          ls -la out
          HASH=$(sha256sum "out/ray-client-${VER}.jar" | cut -d' ' -f1)
          printf 'Ray Client %s for Minecraft 1.21.11 (Fabric).\n\nsha256: %s\n\n' "$VER" "$HASH" > notes.md

      - name: Publish release
        id: rel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Ray Client ${{ env.VER }}
          body_path: notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: out/*.jar

      - name: Show where the release is
        run: |
          echo "## Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "Version ${VER}: ${{ steps.rel.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "All releases: https://github.com/${GITHUB_REPOSITORY}/releases" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep a copy of the jar on the run page
        uses: actions/upload-artifact@v4
        with:
          name: ray-client-${{ env.VER }}
          path: out/*.jar
          if-no-files-found: error
